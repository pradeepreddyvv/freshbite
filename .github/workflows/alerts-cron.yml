name: Alerts Check for every 5 Hours

on:
  schedule:
    # Run every 5 hours at minute 0
    - cron: '0 */5 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  run-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.SITE_URL }}" ]; then
            echo "::error::SITE_URL secret is not set. Please add it to your repository secrets."
            exit 1
          fi
          if [ -z "${{ secrets.ALERTS_SECRET_TOKEN }}" ]; then
            echo "::error::ALERTS_SECRET_TOKEN secret is not set. Please add it to your repository secrets."
            exit 1
          fi
          echo "✅ Secrets configured"

      - name: Trigger alerts endpoint
        run: |
          curl -X POST "${{ secrets.SITE_URL }}/api/alerts/run" \
            -H "Authorization: Bearer ${{ secrets.ALERTS_SECRET_TOKEN }}" \
            -H "Content-Type: application/json" \
            --fail-with-body

      - name: Log completion
        run: echo "Alerts check completed at $(date)"
