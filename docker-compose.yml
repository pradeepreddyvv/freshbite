version: '3.8'

services:
  spring-boot:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    container_name: freshbite-spring
    env_file:
      - .env.prod
    environment:
      - LLM_BASE_URL=http://llm-service:8000
      - SERVER_PORT=8080
      - JAVA_OPTS=-Xmx512m -Xms256m
    restart: unless-stopped
    depends_on:
      llm-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8080/api/restaurants > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - freshbite

  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    container_name: freshbite-llm
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - freshbite

  nginx:
    image: nginx:alpine
    container_name: freshbite-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      spring-boot:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - freshbite

  # ── Redis (caching layer) ──
  redis:
    image: redis:7-alpine
    container_name: freshbite-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 192M
    networks:
      - freshbite

  # ── Kafka (KRaft mode, no Zookeeper needed) ──
  kafka:
    image: bitnami/kafka:3.7
    container_name: freshbite-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_LOG_RETENTION_HOURS=72
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - freshbite

networks:
  freshbite:
    driver: bridge
